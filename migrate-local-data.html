<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Digital — Rescue old local leads</title>
<!--
  ONE-OFF RESCUE TOOL. Deliberately lives OUTSIDE public/ so it is never
  published to the web.

  Before the Firestore move, leads lived in this browser's localStorage under
  the file:// origin. The hosted app runs on a different origin and therefore
  cannot see that storage at all. Open this file directly (double-click) to
  read whatever is still there and save it as JSON, so nothing is stranded.

  Plain <script> on purpose — no modules, so file:// works here.
-->
<style>
  :root{--bg:#060209;--panel:#120a1f;--border:#2d1a4d;--text:#f3eefc;--dim:#ac9ccb;--purple:#8b2fe0;--purple-bright:#c07bff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:40px 20px;line-height:1.5;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:22px;font-weight:800;margin-bottom:6px;}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;}
  .count{font-size:15px;font-weight:700;margin-bottom:4px;}
  .muted{color:var(--dim);font-size:13px;}
  button{background:linear-gradient(135deg,var(--purple-bright),#4c1d95);border:none;color:#fff;
    font-size:14px;font-weight:700;padding:11px 20px;border-radius:9px;cursor:pointer;margin-top:14px;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  pre{background:#0c0716;border:1px solid var(--border);border-radius:9px;padding:14px;
    font-size:12px;color:var(--dim);overflow:auto;max-height:260px;margin-top:14px;white-space:pre-wrap;}
  .none{color:#ff8fa3;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rescue old local leads</h1>
  <p class="sub">Reads the leads still sitting in this browser's local storage from before the Firestore move, and saves them to a JSON file.</p>
  <div id="out"></div>
</div>

<script>
(function(){
  var KEYS = {
    active: 'forgeDigitalLeadFinder_v2',
    archived: 'forgeDigitalArchivedLeads_v1',
    callHistory: 'forgeDigitalHistory_v1'
  };

  function read(key){
    try{
      var raw = localStorage.getItem(key);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }

  var data = {
    exportedAt: new Date().toISOString(),
    active: read(KEYS.active),
    archived: read(KEYS.archived),
    callHistory: read(KEYS.callHistory)
  };
  var total = data.active.length + data.archived.length + data.callHistory.length;
  var out = document.getElementById('out');

  if(!total){
    out.innerHTML = '<div class="card"><p class="none">Nothing found.</p>' +
      '<p class="muted" style="margin-top:8px;">This browser has no old Forge Digital data at this origin. ' +
      'If you previously used a different browser, open this same file there. Otherwise there is nothing to rescue ' +
      'and you can delete this file.</p></div>';
    return;
  }

  var names = data.active.concat(data.archived)
    .map(function(l){ return l && l.businessName; })
    .filter(Boolean);

  out.innerHTML =
    '<div class="card">' +
      '<p class="count">' + data.active.length + ' active · ' + data.archived.length + ' archived · ' + data.callHistory.length + ' call-history entries</p>' +
      '<p class="muted">Save this to a file, then send it to Claude to import into Firestore &mdash; or just keep it as a backup.</p>' +
      '<button id="dl">Download forge-digital-local-backup.json</button>' +
      '<pre id="preview"></pre>' +
    '</div>';

  document.getElementById('preview').textContent =
    names.length ? 'Businesses found:\n' + names.join('\n') : 'No business names found.';

  document.getElementById('dl').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'forge-digital-local-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    this.textContent = 'Saved ✓';
    this.disabled = true;
  });
})();
</script>
</body>
</html>
